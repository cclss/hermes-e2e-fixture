<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✊✌️🖐 가위바위보</title>

  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS — 가위바위보 웹 게임
       Grain-1 결정 · 2026-06-10
       ============================================================ */
    :root {
      /* ── COLOR ─────────────────────────────────────────────── */
      --color-bg:               #09090f;
      --color-surface:          #13131f;
      --color-surface-elevated: #1c1c2e;
      --color-border:           #2e2e4a;
      --color-border-focus:     #5a5a8a;
      --color-text-primary:     #eeeeff;
      --color-text-secondary:   #9090b0;
      --color-text-muted:       #55557a;
      --color-neutral:          #3a3a5c;
      --color-accent-win:       #00ff87;
      --color-accent-lose:      #ff2d55;
      --color-accent-draw:      #ffd60a;
      --color-accent-primary:   #7c3aed;
      --color-accent-secondary: #06b6d4;
      --color-mode-fair:        #00ff87;
      --color-mode-unfair:      #ff2d55;

      /* ── GRADIENT ───────────────────────────────────────────── */
      --gradient-hero:         linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
      --gradient-win:          linear-gradient(135deg, #00ff87 0%, #06b6d4 100%);
      --gradient-lose:         linear-gradient(135deg, #ff2d55 0%, #ff6b6b 100%);
      --gradient-draw:         linear-gradient(135deg, #ffd60a 0%, #ff9500 100%);
      --gradient-cta:          linear-gradient(135deg, #7c3aed 0%, #ff2d55 100%);
      --gradient-choice-hover: linear-gradient(135deg, #1c1c2e 0%, #2e2e4a 100%);

      /* ── TYPOGRAPHY ─────────────────────────────────────────── */
      --font-family-primary:     'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text-size-display:       3.5rem;
      --text-size-headline:      2rem;
      --text-size-title:         1.5rem;
      --text-size-body-lg:       1.125rem;
      --text-size-body:          1rem;
      --text-size-sm:            0.875rem;
      --text-size-xs:            0.75rem;
      --text-weight-black:       900;
      --text-weight-bold:        800;
      --text-weight-semibold:    600;
      --text-weight-normal:      400;
      --text-line-height-tight:  1.1;
      --text-line-height-snug:   1.3;
      --text-line-height-normal: 1.5;

      /* ── SPACING ────────────────────────────────────────────── */
      --space-2xs: 2px;
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  40px;
      --space-2xl: 64px;
      --space-3xl: 96px;

      /* ── RADIUS ─────────────────────────────────────────────── */
      --radius-sm:   8px;
      --radius-md:   16px;
      --radius-lg:   24px;
      --radius-xl:   32px;
      --radius-pill: 9999px;

      /* ── SHADOW ─────────────────────────────────────────────── */
      --shadow-sm:           0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-md:           0 4px 20px rgba(0, 0, 0, 0.6);
      --shadow-glow-win:     0 0 20px rgba(0, 255, 135, 0.5);
      --shadow-glow-lose:    0 0 20px rgba(255, 45, 85, 0.5);
      --shadow-glow-draw:    0 0 20px rgba(255, 214, 10, 0.5);
      --shadow-glow-primary: 0 0 20px rgba(124, 58, 237, 0.6);
      --shadow-glow-fair:    0 0 12px rgba(0, 255, 135, 0.4);
      --shadow-glow-unfair:  0 0 12px rgba(255, 45, 85, 0.4);

      /* ── TRANSITION ─────────────────────────────────────────── */
      --duration-fast:           150ms;
      --duration-normal:         300ms;
      --duration-slow:           600ms;
      --duration-countdown-step: 600ms;
      --duration-reveal:         500ms;
      --duration-result-hold:    2500ms;
      --easing-standard:         cubic-bezier(0.4, 0, 0.2, 1);
      --easing-bounce:           cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-decelerate:       cubic-bezier(0.0, 0.0, 0.2, 1);
      --easing-accelerate:       cubic-bezier(0.4, 0.0, 1, 1);

      /* ── COMBO [grain-2] ────────────────────────────────────── */
      --gradient-combo:         linear-gradient(135deg, #ff6b00 0%, #ff2d55 100%);
      --color-combo-fire:       #ff6b00;
      --shadow-glow-combo:      0 0 20px rgba(255, 107, 0, 0.6);
    }

    /* ============================================================
       KEYFRAMES
       ============================================================ */
    @keyframes kf-countdown-pulse {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.4); opacity: 1; }
      70%  { transform: scale(1.2); opacity: 0.8; }
      100% { transform: scale(1);   opacity: 1; }
    }

    @keyframes kf-reveal-bounce {
      0%   { transform: translateY(40px); opacity: 0; }
      60%  { transform: translateY(-6px); opacity: 1; }
      100% { transform: translateY(0);    opacity: 1; }
    }

    @keyframes kf-win-glow {
      0%, 100% { box-shadow: 0 0 8px  rgba(0, 255, 135, 0.4); }
      50%       { box-shadow: 0 0 32px rgba(0, 255, 135, 0.9); }
    }

    @keyframes kf-lose-shake {
      0%, 100%              { transform: translateX(0); }
      10%, 30%, 50%, 70%    { transform: translateX(-8px); }
      20%, 40%, 60%, 80%    { transform: translateX(8px); }
    }

    @keyframes kf-draw-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes kf-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    @keyframes kf-neon-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55%                           { opacity: 0.8; }
    }

    @keyframes kf-screen-slide-up {
      from { transform: translateY(0);     opacity: 1; }
      to   { transform: translateY(-20px); opacity: 0; }
    }

    @keyframes kf-screen-enter {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    @keyframes kf-choice-select {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.9); }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes kf-ripple {
      from { transform: scale(0); opacity: 0.6; }
      to   { transform: scale(2.5); opacity: 0; }
    }

    @keyframes kf-badge-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(255, 45, 85, 0.5); }
      50%      { box-shadow: 0 0 16px rgba(255, 45, 85, 0.9); }
    }

    @keyframes kf-progress-bar {
      from { width: 100%; }
      to   { width: 0%; }
    }

    @keyframes kf-score-bump {
      0%   { transform: scale(1);    }
      35%  { transform: scale(1.45); }
      65%  { transform: scale(0.95); }
      100% { transform: scale(1);    }
    }

    /* grain-2 ── 콘페티 낙하 */
    @keyframes kf-confetti-fall {
      0%   {
        transform: translateY(0) rotate(var(--cf-init-rot, 0deg));
        opacity: 1;
      }
      80%  { opacity: 1; }
      100% {
        transform: translateY(110vh) rotate(calc(var(--cf-init-rot, 0deg) + 540deg)) scaleX(0.5);
        opacity: 0;
      }
    }

    /* grain-2 ── 링 하이로 회전 */
    @keyframes kf-ring-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* grain-2 ── 콤보 배지 펄스 */
    @keyframes kf-combo-pulse {
      0%, 100% { transform: scale(1);     box-shadow: 0 0 16px rgba(255, 107, 0, 0.45); }
      50%       { transform: scale(1.06); box-shadow: 0 0 32px rgba(255, 107, 0, 0.9);  }
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-family-primary);
      font-size: var(--text-size-body);
      font-weight: var(--text-weight-normal);
      line-height: var(--text-line-height-normal);
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ============================================================
       UTILITY
       ============================================================ */
    .hidden {
      display: none !important;
    }

    /* ============================================================
       APP WRAPPER — fills viewport, stacks screens
       ============================================================ */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── Background decorative gradient blobs ─────────────────── */
    #app::before,
    #app::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    #app::before {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%);
      top: -100px;
      right: -100px;
    }
    #app::after {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
    }

    /* ── Common screen layout ─────────────────────────────────── */
    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg) var(--space-md);
      position: relative;
      z-index: 1;
      animation: kf-screen-enter var(--duration-normal) var(--easing-decelerate) both;
    }

    /* ── Glassmorphism card base ──────────────────────────────── */
    .glass-card {
      background: rgba(19, 19, 31, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    /* ============================================================
       SCREEN 1 — START SCREEN
       ============================================================ */
    #start-screen {
      gap: var(--space-xl);
    }

    /* Hero title area */
    .start-hero {
      text-align: center;
    }

    .start-hero__emoji-row {
      font-size: 3rem;
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .start-hero__emoji-row span {
      display: inline-block;
      animation: kf-float 3s var(--easing-standard) infinite;
    }
    .start-hero__emoji-row span:nth-child(2) { animation-delay: 0.5s; }
    .start-hero__emoji-row span:nth-child(3) { animation-delay: 1s; }

    .start-hero__title {
      font-size: var(--text-size-display);
      font-weight: var(--text-weight-black);
      line-height: var(--text-line-height-tight);
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: kf-neon-flicker 4s ease-in-out infinite;
    }

    .start-hero__sub {
      margin-top: var(--space-sm);
      font-size: var(--text-size-sm);
      color: var(--color-text-muted);
      font-weight: var(--text-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Mode selector */
    .mode-selector {
      width: 100%;
      max-width: 360px;
    }

    .mode-selector__label {
      font-size: var(--text-size-sm);
      font-weight: var(--text-weight-semibold);
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: var(--space-md);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .mode-selector__cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .mode-card {
      padding: var(--space-md) var(--space-sm);
      border-radius: var(--radius-md);
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      text-align: center;
      cursor: pointer;
      transition:
        border-color var(--duration-fast) var(--easing-standard),
        box-shadow   var(--duration-fast) var(--easing-standard),
        background   var(--duration-fast) var(--easing-standard),
        transform    var(--duration-fast) var(--easing-standard);
      user-select: none;
    }

    .mode-card:hover {
      transform: translateY(-2px);
      background: var(--color-surface-elevated);
    }

    /* Fair mode — active state */
    .mode-card--fair.mode-card--active {
      border-color: var(--color-mode-fair);
      box-shadow: var(--shadow-glow-fair);
      background: rgba(0, 255, 135, 0.06);
    }

    /* Unfair mode — active state */
    .mode-card--unfair.mode-card--active {
      border-color: var(--color-mode-unfair);
      box-shadow: var(--shadow-glow-unfair);
      background: rgba(255, 45, 85, 0.06);
    }

    .mode-card__icon {
      font-size: 2rem;
      display: block;
      margin-bottom: var(--space-xs);
    }

    .mode-card__name {
      font-size: var(--text-size-body-lg);
      font-weight: var(--text-weight-bold);
      display: block;
      margin-bottom: var(--space-2xs);
    }

    .mode-card--fair  .mode-card__name { color: var(--color-text-primary); }
    .mode-card--unfair .mode-card__name { color: var(--color-text-primary); }

    .mode-card--fair.mode-card--active  .mode-card__name { color: var(--color-mode-fair); }
    .mode-card--unfair.mode-card--active .mode-card__name { color: var(--color-mode-unfair); }

    .mode-card__desc {
      font-size: var(--text-size-xs);
      color: var(--color-text-secondary);
      line-height: var(--text-line-height-snug);
      display: block;
    }

    .mode-card--unfair.mode-card--active .mode-card__desc {
      color: var(--color-mode-unfair);
    }

    /* CTA button */
    .btn-cta {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      width: 100%;
      max-width: 360px;
      padding: var(--space-md) var(--space-xl);
      border: none;
      border-radius: var(--radius-pill);
      background: var(--gradient-cta);
      color: #fff;
      font-family: var(--font-family-primary);
      font-size: var(--text-size-body-lg);
      font-weight: var(--text-weight-bold);
      cursor: pointer;
      box-shadow: var(--shadow-glow-primary);
      transition:
        transform    var(--duration-fast) var(--easing-standard),
        box-shadow   var(--duration-fast) var(--easing-standard),
        opacity      var(--duration-fast) var(--easing-standard);
    }

    .btn-cta:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 32px rgba(124, 58, 237, 0.8);
    }

    .btn-cta:active {
      transform: scale(0.97);
    }

    /* Ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      width: 60px;
      height: 60px;
      margin-top: -30px;
      margin-left: -30px;
      pointer-events: none;
      animation: kf-ripple 0.6s var(--easing-accelerate) forwards;
    }

    /* ============================================================
       SCREEN 2 — GAME SCREEN
       ============================================================ */
    #game-screen {
      gap: var(--space-lg);
    }

    /* Mode badge */
    .mode-badge {
      position: fixed;
      top: var(--space-md);
      right: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-pill);
      font-size: var(--text-size-sm);
      font-weight: var(--text-weight-semibold);
      z-index: 100;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .mode-badge--fair {
      background: rgba(0, 255, 135, 0.12);
      border: 1px solid rgba(0, 255, 135, 0.4);
      color: var(--color-mode-fair);
    }

    .mode-badge--unfair {
      background: rgba(255, 45, 85, 0.12);
      border: 1px solid rgba(255, 45, 85, 0.4);
      color: var(--color-mode-unfair);
      animation: kf-badge-pulse 2s ease-in-out infinite;
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      align-items: center;
      gap: var(--space-xl);
      padding: var(--space-md) var(--space-xl);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
    }

    .score-item {
      text-align: center;
      min-width: 56px;
    }

    .score-item__label {
      font-size: var(--text-size-xs);
      font-weight: var(--text-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      display: block;
      margin-bottom: var(--space-2xs);
    }

    .score-item__value {
      font-size: var(--text-size-headline);
      font-weight: var(--text-weight-black);
      line-height: var(--text-line-height-tight);
      display: block;
    }

    .score-item--win  .score-item__value { color: var(--color-accent-win); }
    .score-item--draw .score-item__value { color: var(--color-accent-draw); }
    .score-item--lose .score-item__value { color: var(--color-accent-lose); }

    .score-divider {
      width: 1px;
      height: 40px;
      background: var(--color-border);
      flex-shrink: 0;
    }

    /* Game prompt text */
    .game-prompt {
      font-size: var(--text-size-title);
      font-weight: var(--text-weight-bold);
      color: var(--color-text-secondary);
      text-align: center;
    }

    /* Choice buttons */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      width: 100%;
      max-width: 420px;
    }

    .btn-choice {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      aspect-ratio: 1;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      cursor: pointer;
      transition:
        transform    var(--duration-fast) var(--easing-bounce),
        box-shadow   var(--duration-fast) var(--easing-standard),
        border-color var(--duration-fast) var(--easing-standard),
        background   var(--duration-fast) var(--easing-standard);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-choice:hover {
      transform: scale(1.08);
      border-color: var(--color-border-focus);
      background: var(--gradient-choice-hover);
      box-shadow:
        var(--shadow-md),
        0 0 20px rgba(124, 58, 237, 0.3);
    }

    .btn-choice:active {
      animation: kf-choice-select 0.25s var(--easing-bounce);
    }

    .btn-choice__emoji {
      font-size: 2.5rem;
      line-height: 1;
      display: block;
    }

    .btn-choice__label {
      font-size: var(--text-size-sm);
      font-weight: var(--text-weight-semibold);
      color: var(--color-text-secondary);
    }

    /* End game button */
    .btn-end {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-family: var(--font-family-primary);
      font-size: var(--text-size-sm);
      font-weight: var(--text-weight-semibold);
      cursor: pointer;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      transition:
        color      var(--duration-fast) var(--easing-standard),
        border-color var(--duration-fast) var(--easing-standard),
        background var(--duration-fast) var(--easing-standard);
    }

    .btn-end:hover {
      color: var(--color-accent-lose);
      border-color: var(--color-accent-lose);
      background: rgba(255, 45, 85, 0.08);
    }

    /* ============================================================
       SCREEN 3 — COUNTDOWN SCREEN
       ============================================================ */
    #countdown-screen {
      background: var(--color-surface);
      gap: var(--space-xl);
    }

    .countdown-display {
      text-align: center;
      position: relative;
    }

    .countdown-display__text {
      font-size: var(--text-size-display);
      font-weight: var(--text-weight-black);
      line-height: var(--text-line-height-tight);
      color: var(--color-text-primary);
      display: block;
      animation: kf-countdown-pulse var(--duration-countdown-step) var(--easing-bounce) both;
    }

    .countdown-display__text--final {
      background: var(--gradient-cta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .countdown-display__hint {
      margin-top: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      color: var(--color-text-muted);
      font-size: var(--text-size-sm);
    }

    .countdown-display__choice-lock {
      font-size: 1.25rem;
    }

    /* Progress bar */
    .countdown-progress {
      width: 240px;
      height: 4px;
      background: var(--color-border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .countdown-progress__fill {
      height: 100%;
      width: 100%;
      background: var(--gradient-cta);
      border-radius: var(--radius-pill);
      animation: kf-progress-bar 1.8s linear both;
    }

    /* ============================================================
       SCREEN 4 — RESULT SCREEN
       ============================================================ */
    #result-screen {
      gap: var(--space-lg);
      position: relative;
    }

    /* Tinted result overlay */
    .result-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 0;
      opacity: 0.15;
      z-index: 0;
      transition: background var(--duration-normal) var(--easing-standard);
    }

    .result-overlay--win  { background: var(--gradient-win); }
    .result-overlay--lose { background: var(--gradient-lose); }
    .result-overlay--draw { background: var(--gradient-draw); }

    .result-screen__inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      width: 100%;
      max-width: 480px;
    }

    /* Result banner */
    .result-banner {
      font-size: var(--text-size-display);
      font-weight: var(--text-weight-black);
      letter-spacing: 0.06em;
      text-align: center;
    }

    .result-banner--win {
      color: var(--color-accent-win);
      animation: kf-win-glow 1.5s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(0, 255, 135, 0.6);
    }

    .result-banner--lose {
      color: var(--color-accent-lose);
      animation: kf-lose-shake 0.6s var(--easing-standard) both;
    }

    .result-banner--draw {
      color: var(--color-accent-draw);
      animation: kf-draw-spin 0.5s var(--easing-standard) both;
    }

    /* Hand reveal cards */
    .result-hands {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      width: 100%;
      justify-content: center;
    }

    .result-hand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      min-width: 100px;
      animation: kf-reveal-bounce var(--duration-reveal) var(--easing-bounce) both;
    }

    .result-hand--user     { animation-delay: 0s; }
    .result-hand--computer { animation-delay: 0.4s; }

    .result-hand__emoji {
      font-size: 3.5rem;
      line-height: 1;
      display: block;
    }

    .result-hand__who {
      font-size: var(--text-size-xs);
      font-weight: var(--text-weight-semibold);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .result-hand__choice {
      font-size: var(--text-size-sm);
      font-weight: var(--text-weight-bold);
      color: var(--color-text-secondary);
    }

    /* VS divider */
    .result-vs {
      font-size: var(--text-size-title);
      font-weight: var(--text-weight-black);
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    /* Unfair mode curse text */
    .result-curse {
      font-size: var(--text-size-sm);
      color: var(--color-mode-unfair);
      text-align: center;
      font-weight: var(--text-weight-semibold);
      opacity: 0;
      transition: opacity var(--duration-normal) var(--easing-standard);
    }

    .result-curse--visible {
      opacity: 1;
    }

    /* Next round button */
    .btn-next {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-2xl);
      border: none;
      border-radius: var(--radius-pill);
      background: var(--gradient-cta);
      color: #fff;
      font-family: var(--font-family-primary);
      font-size: var(--text-size-body-lg);
      font-weight: var(--text-weight-bold);
      cursor: pointer;
      box-shadow: var(--shadow-glow-primary);
      transition:
        transform    var(--duration-fast) var(--easing-standard),
        box-shadow   var(--duration-fast) var(--easing-standard);
      animation: kf-reveal-bounce var(--duration-reveal) var(--easing-bounce) 0.5s both;
    }

    .btn-next:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 32px rgba(124, 58, 237, 0.8);
    }

    .btn-next:active {
      transform: scale(0.97);
    }

    /* Computer hand unfair tint */
    .result-hand--computer.unfair-tint {
      background: rgba(255, 45, 85, 0.07);
      border: 1px solid rgba(255, 45, 85, 0.2);
    }

    /* ============================================================
       CONFETTI — WIN 축하 파티클  [grain-2]
       ============================================================ */
    .confetti-piece {
      position: fixed;
      top: -20px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 999;
      animation: kf-confetti-fall var(--cf-dur, 2s) ease-in forwards;
    }

    /* ============================================================
       RING HALO — WIN 회전 링 데코  [grain-2]
       ============================================================ */
    .ring-halo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ring-halo {
      position: absolute;
      --ring-size: min(78vw, 420px);
      width: var(--ring-size);
      height: var(--ring-size);
      top:  calc(-1 * var(--ring-size) / 2);
      left: calc(-1 * var(--ring-size) / 2);
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color:   rgba(0, 255, 135, 0.55);
      border-right-color: rgba(6, 182, 212, 0.35);
      animation: kf-ring-rotate 3s linear infinite;
    }

    .ring-halo--inner {
      --ring-size: min(48vw, 260px);
      border-width: 1px;
      border-top-color:  rgba(255, 214, 10, 0.40);
      border-left-color: rgba(124, 58, 237, 0.45);
      animation-duration: 2s;
      animation-direction: reverse;
    }

    /* ============================================================
       COMBO BADGE — 연속 승리 스트릭  [grain-2]
       ============================================================ */
    .combo-badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-xs) var(--space-lg);
      border-radius: var(--radius-pill);
      background: var(--gradient-combo);
      color: #fff;
      font-size: var(--text-size-title);
      font-weight: var(--text-weight-black);
      letter-spacing: 0.04em;
      animation:
        kf-reveal-bounce var(--duration-reveal) var(--easing-bounce) both,
        kf-combo-pulse   1.5s ease-in-out 0.5s infinite;
    }

    /* ============================================================
       RESPONSIVE — 768px+
       ============================================================ */
    @media (min-width: 768px) {
      .start-hero__title {
        font-size: 4.5rem;
      }

      .start-hero__emoji-row {
        font-size: 4rem;
      }

      .mode-selector {
        max-width: 480px;
      }

      .btn-cta {
        max-width: 480px;
        font-size: var(--text-size-title);
        padding: var(--space-lg) var(--space-2xl);
      }

      .choice-grid {
        max-width: 500px;
        gap: var(--space-lg);
      }

      .btn-choice__emoji {
        font-size: 3.5rem;
      }

      .btn-choice__label {
        font-size: var(--text-size-body);
      }

      .countdown-display__text {
        font-size: 5rem;
      }

      .result-banner {
        font-size: 5rem;
      }

      .result-hand {
        min-width: 140px;
        padding: var(--space-xl);
      }

      .result-hand__emoji {
        font-size: 5rem;
      }

      .scoreboard {
        gap: var(--space-2xl);
      }
    }

    /* ============================================================
       RESPONSIVE — 1280px+
       ============================================================ */
    @media (min-width: 1280px) {
      .screen {
        padding: var(--space-xl) var(--space-2xl);
      }

      .start-hero__title {
        font-size: 5.5rem;
      }

      .start-hero__emoji-row {
        font-size: 5rem;
      }

      .mode-selector {
        max-width: 540px;
      }

      .btn-cta {
        max-width: 540px;
      }

      .choice-grid {
        max-width: 540px;
      }

      .btn-choice {
        border-radius: var(--radius-xl);
      }

      .result-screen__inner {
        max-width: 600px;
      }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ① START SCREEN ─────────────────────────────────────────── -->
  <section id="start-screen" class="screen">

    <!-- Hero title -->
    <div class="start-hero">
      <div class="start-hero__emoji-row">
        <span>✊</span><span>✌️</span><span>🖐</span>
      </div>
      <h1 class="start-hero__title">가위바위보</h1>
      <p class="start-hero__sub">컴퓨터와 한판 붙어보자</p>
    </div>

    <!-- Mode selector -->
    <div class="mode-selector">
      <p class="mode-selector__label">모드 선택</p>
      <div class="mode-selector__cards">

        <!-- Fair mode card -->
        <button
          class="mode-card mode-card--fair mode-card--active"
          id="mode-fair"
          data-mode="fair"
          type="button"
          aria-pressed="true"
        >
          <span class="mode-card__icon">⚖️</span>
          <span class="mode-card__name">공정</span>
          <span class="mode-card__desc">컴퓨터가 무작위로 패를 냅니다</span>
        </button>

        <!-- Unfair mode card -->
        <button
          class="mode-card mode-card--unfair"
          id="mode-unfair"
          data-mode="unfair"
          type="button"
          aria-pressed="false"
        >
          <span class="mode-card__icon">😈</span>
          <span class="mode-card__name">불공정</span>
          <span class="mode-card__desc">컴퓨터가 70% 확률로 이깁니다 😈</span>
        </button>

      </div>
    </div>

    <!-- Start CTA -->
    <button class="btn-cta" id="btn-start" type="button">
      🎮 게임 시작
    </button>

  </section>


  <!-- ② GAME SCREEN ──────────────────────────────────────────── -->
  <section id="game-screen" class="screen hidden">

    <!-- Mode badge (fixed, shared across game/countdown/result) -->
    <div class="mode-badge mode-badge--fair" id="mode-badge">
      <span id="mode-badge-icon">⚖️</span>
      <span id="mode-badge-label">공정</span>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard" id="scoreboard">
      <div class="score-item score-item--win">
        <span class="score-item__label">승</span>
        <span class="score-item__value" id="score-win">0</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item score-item--draw">
        <span class="score-item__label">무</span>
        <span class="score-item__value" id="score-draw">0</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item score-item--lose">
        <span class="score-item__label">패</span>
        <span class="score-item__value" id="score-lose">0</span>
      </div>
    </div>

    <!-- Prompt -->
    <p class="game-prompt">패를 선택하세요!</p>

    <!-- Choice buttons -->
    <div class="choice-grid">
      <button class="btn-choice" id="choice-scissors" data-choice="scissors" type="button" aria-label="가위">
        <span class="btn-choice__emoji">✌️</span>
        <span class="btn-choice__label">가위</span>
      </button>
      <button class="btn-choice" id="choice-rock" data-choice="rock" type="button" aria-label="바위">
        <span class="btn-choice__emoji">🤜</span>
        <span class="btn-choice__label">바위</span>
      </button>
      <button class="btn-choice" id="choice-paper" data-choice="paper" type="button" aria-label="보">
        <span class="btn-choice__emoji">🖐</span>
        <span class="btn-choice__label">보</span>
      </button>
    </div>

    <!-- End game -->
    <button class="btn-end" id="btn-end" type="button">게임 종료</button>

  </section>


  <!-- ③ COUNTDOWN SCREEN ─────────────────────────────────────── -->
  <section id="countdown-screen" class="screen hidden">

    <div class="countdown-display">
      <span class="countdown-display__text" id="countdown-text">가위!</span>
      <div class="countdown-display__hint">
        <span class="countdown-display__choice-lock" id="countdown-user-emoji">✌️</span>
        <span id="countdown-user-label">가위 선택됨</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="countdown-progress">
      <div class="countdown-progress__fill" id="countdown-progress-fill"></div>
    </div>

  </section>


  <!-- ④ RESULT SCREEN ────────────────────────────────────────── -->
  <section id="result-screen" class="screen hidden">

    <!-- Ring halo — WIN 회전 데코 (grain-2) -->
    <div class="ring-halo-wrap hidden" id="ring-halo-wrap">
      <div class="ring-halo"></div>
      <div class="ring-halo ring-halo--inner"></div>
    </div>

    <!-- Background tint overlay -->
    <div class="result-overlay result-overlay--win" id="result-overlay"></div>

    <div class="result-screen__inner">

      <!-- Combo streak badge — ≥2 연속 승리 시 노출 (grain-2) -->
      <div class="combo-badge hidden" id="combo-badge">🔥 2연승!</div>

      <!-- Result banner -->
      <div class="result-banner result-banner--win" id="result-banner">WIN</div>

      <!-- Hands reveal -->
      <div class="result-hands">
        <div class="result-hand result-hand--user glass-card">
          <span class="result-hand__emoji" id="result-user-emoji">✌️</span>
          <span class="result-hand__who">나</span>
          <span class="result-hand__choice" id="result-user-label">가위</span>
        </div>

        <div class="result-vs">VS</div>

        <div class="result-hand result-hand--computer glass-card" id="result-computer-card">
          <span class="result-hand__emoji" id="result-computer-emoji">🤜</span>
          <span class="result-hand__who">컴퓨터</span>
          <span class="result-hand__choice" id="result-computer-label">바위</span>
        </div>
      </div>

      <!-- Unfair mode curse text -->
      <p class="result-curse" id="result-curse">😈 불공정 모드의 저주…</p>

      <!-- Next round button -->
      <button class="btn-next" id="btn-next" type="button">
        다음 라운드 ▶
      </button>

    </div>
  </section>

</div>

<script>
  /* ============================================================
     가위바위보 — Vanilla JS Game Engine
     Grain-3 구현 · 2026-06-10
     Design Spec 모션 토큰 참조: design-spec.md §4
     ============================================================ */
  'use strict';

  /* ──────────────────────────────────────────────────────────
     1. CONSTANTS
  ────────────────────────────────────────────────────────── */
  var CHOICES = ['scissors', 'rock', 'paper'];

  var META = {
    scissors: { emoji: '✌️',  label: '가위' },
    rock:     { emoji: '🤜', label: '바위' },
    paper:    { emoji: '🖐',  label: '보'   },
  };

  // BEATS[x] = 가 x를 이기는 패 (컴퓨터가 불공정 모드에서 이 값을 70% 선택)
  var BEATS = {
    scissors: 'rock',
    rock:     'paper',
    paper:    'scissors',
  };

  // 이스터에그 문구 — 불공정+패배 시 결과 화면 표시 (design-spec.md §5)
  var EASTER_EGG_LABEL = '😈 불공정 모드의 저주…';

  // 카운트다운 단계 텍스트
  var CD_STEPS = ['가위!', '바위!', '보!'];

  // Design Spec 모션 토큰 → JS ms 값 (§4 Duration)
  var DUR = {
    FAST:           150,   // --duration-fast
    NORMAL:         300,   // --duration-normal
    COUNTDOWN_STEP: 600,   // --duration-countdown-step
    REVEAL:         500,   // --duration-reveal
  };

  /* ──────────────────────────────────────────────────────────
     Web Audio Engine (grain-2)
     design-spec.md §10: AudioContext, try/catch 미지원 브라우저 무음 폴백
  ────────────────────────────────────────────────────────── */
  var SFX = (function () {
    var ctx = null;

    function init() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { ctx = null; }
    }

    function resume() {
      if (ctx && ctx.state === 'suspended') {
        try { ctx.resume(); } catch (e) {}
      }
    }

    function tone(freq, when, dur, type, vol) {
      if (!ctx) return;
      try {
        var osc  = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, when);
        gain.gain.setValueAtTime(vol || 0.22, when);
        gain.gain.exponentialRampToValueAtTime(0.001, when + dur);
        osc.start(when);
        osc.stop(when + dur + 0.05);
      } catch (e) {}
    }

    return {
      win: function () {
        init(); resume();
        if (!ctx) return;
        var t = ctx.currentTime;
        tone(523.25, t,       0.10, 'sine', 0.22);  // C5
        tone(659.25, t+0.09,  0.10, 'sine', 0.22);  // E5
        tone(783.99, t+0.18,  0.10, 'sine', 0.22);  // G5
        tone(1046.5, t+0.27,  0.50, 'sine', 0.28);  // C6
      },
      lose: function () {
        init(); resume();
        if (!ctx) return;
        var t = ctx.currentTime;
        tone(392.0,  t,       0.18, 'sawtooth', 0.16);  // G4
        tone(329.63, t+0.15,  0.18, 'sawtooth', 0.14);  // E4
        tone(261.63, t+0.30,  0.45, 'sawtooth', 0.13);  // C4
      },
      draw: function () {
        init(); resume();
        if (!ctx) return;
        var t = ctx.currentTime;
        tone(440, t,       0.28, 'triangle', 0.18);  // A4
        tone(440, t+0.32,  0.15, 'triangle', 0.10);
      },
      click: function () {
        init(); resume();
        if (!ctx) return;
        var t = ctx.currentTime;
        tone(780, t, 0.055, 'square', 0.11);
      },
      countdownTick: function (isFinal) {
        init(); resume();
        if (!ctx) return;
        var t = ctx.currentTime;
        if (isFinal) {
          tone(880,  t,       0.07, 'sine', 0.22);
          tone(1100, t+0.07,  0.12, 'sine', 0.18);
        } else {
          tone(600, t, 0.07, 'sine', 0.18);
        }
      },
    };
  }());

  /* ──────────────────────────────────────────────────────────
     Confetti Engine (grain-2)
     design-spec.md §10: kf-confetti-fall, CSS custom property --cf-init-rot
  ────────────────────────────────────────────────────────── */
  var CONFETTI_COLORS = [
    '#00ff87', '#7c3aed', '#06b6d4',
    '#ffd60a', '#ff2d55', '#ffffff',
  ];

  function spawnConfetti() {
    var count = 64;
    for (var i = 0; i < count; i++) {
      (function () {
        var el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left   = (Math.random() * 100) + 'vw';
        el.style.width  = (5  + Math.random() * 8)  + 'px';
        el.style.height = (8  + Math.random() * 14) + 'px';
        el.style.backgroundColor = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.setProperty('--cf-init-rot', (Math.random() * 360) + 'deg');
        el.style.setProperty('--cf-dur', (1.4 + Math.random() * 1.6) + 's');
        el.style.animationDelay = (Math.random() * 0.9) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', function () { el.remove(); });
      }());
    }
  }

  function clearConfetti() {
    document.querySelectorAll('.confetti-piece').forEach(function (el) { el.remove(); });
  }

  /* ──────────────────────────────────────────────────────────
     Combo Badge Helper (grain-2)
     design-spec.md §10: 콤보 배지 토큰 · 위치
  ────────────────────────────────────────────────────────── */
  function updateComboBadge() {
    if (!E.comboBadge) return;
    if (state.combo < 2) {
      E.comboBadge.classList.add('hidden');
      return;
    }
    var icon = state.combo >= 5 ? '⚡' : state.combo >= 4 ? '💥' : '🔥';
    E.comboBadge.textContent = icon + ' ' + state.combo + '연승!';
    E.comboBadge.classList.remove('hidden');
    retriggerAnimation(E.comboBadge);
  }

  /* ──────────────────────────────────────────────────────────
     2. STATE
  ────────────────────────────────────────────────────────── */
  var state = {
    fsm:        'start',   // 'start' | 'playing' | 'countdown' | 'result'
    mode:       'fair',    // 'fair'  | 'unfair'
    userChoice: null,      // 'scissors' | 'rock' | 'paper'
    compChoice: null,
    outcome:    null,      // 'win' | 'lose' | 'draw'
    score:      { win: 0, draw: 0, lose: 0 },
    combo:      0,         // 연속 승리 횟수 (grain-2)
    busy:       false,     // FSM 이중진입 방어 플래그
  };

  /* ──────────────────────────────────────────────────────────
     3. DOM REFS
  ────────────────────────────────────────────────────────── */
  function $(id) { return document.getElementById(id); }

  var S = {                          // Screens
    start:     $('start-screen'),
    game:      $('game-screen'),
    countdown: $('countdown-screen'),
    result:    $('result-screen'),
  };

  var E = {                          // Elements
    modeFair:       $('mode-fair'),
    modeUnfair:     $('mode-unfair'),
    btnStart:       $('btn-start'),
    modeBadge:      $('mode-badge'),
    modeBadgeIcon:  $('mode-badge-icon'),
    modeBadgeLabel: $('mode-badge-label'),
    scoreWin:       $('score-win'),
    scoreDraw:      $('score-draw'),
    scoreLose:      $('score-lose'),
    btnEnd:         $('btn-end'),
    cdText:         $('countdown-text'),
    cdUserEmoji:    $('countdown-user-emoji'),
    cdUserLabel:    $('countdown-user-label'),
    cdProgFill:     $('countdown-progress-fill'),
    resBanner:      $('result-banner'),
    resOverlay:     $('result-overlay'),
    resUserEmoji:   $('result-user-emoji'),
    resUserLabel:   $('result-user-label'),
    resCompEmoji:   $('result-computer-emoji'),
    resCompLabel:   $('result-computer-label'),
    resCompCard:    $('result-computer-card'),
    resCurse:       $('result-curse'),
    btnNext:        $('btn-next'),
    comboBadge:     $('combo-badge'),    // grain-2
    ringHaloWrap:   $('ring-halo-wrap'), // grain-2
  };

  /* ──────────────────────────────────────────────────────────
     4. INIT — mode-badge DOM 재배치
     (game-screen 자식 → app 직계 자식)
     position:fixed 렌더링 위치는 동일, hidden 제어를 JS가 담당
  ────────────────────────────────────────────────────────── */
  (function hoistBadge() {
    document.getElementById('app').appendChild(E.modeBadge);
    E.modeBadge.classList.add('hidden');
  }());

  /* ──────────────────────────────────────────────────────────
     5. HELPERS
  ────────────────────────────────────────────────────────── */

  /** 화면 전환 — .hidden 토글 헬퍼 */
  function showScreen(name) {
    Object.keys(S).forEach(function(k) {
      S[k].classList.add('hidden');
    });
    if (S[name]) S[name].classList.remove('hidden');

    // 배지는 playing/countdown/result 중에만 표시
    var inGame = (name === 'game' || name === 'countdown' || name === 'result');
    E.modeBadge.classList.toggle('hidden', !inGame);
  }

  /** 스코어 UI 갱신 — 증가한 항목에 kf-score-bump 적용 */
  function updateScoreUI() {
    var prevWin  = +E.scoreWin.textContent  || 0;
    var prevDraw = +E.scoreDraw.textContent || 0;
    var prevLose = +E.scoreLose.textContent || 0;
    E.scoreWin.textContent  = state.score.win;
    E.scoreDraw.textContent = state.score.draw;
    E.scoreLose.textContent = state.score.lose;
    if (state.score.win  > prevWin)  bumpScoreEl(E.scoreWin);
    if (state.score.draw > prevDraw) bumpScoreEl(E.scoreDraw);
    if (state.score.lose > prevLose) bumpScoreEl(E.scoreLose);
  }

  /** 버튼 리플 효과 */
  function addRipple(btn, event) {
    var r = document.createElement('span');
    r.className = 'ripple';
    var rect = btn.getBoundingClientRect();
    r.style.left = (event.clientX - rect.left) + 'px';
    r.style.top  = (event.clientY - rect.top)  + 'px';
    btn.appendChild(r);
    r.addEventListener('animationend', function() { r.remove(); });
  }

  /** CSS 애니메이션 재실행 (동일 요소에 같은 animation 재트리거) */
  function retriggerAnimation(el) {
    el.style.animation = 'none';
    void el.offsetWidth;           // force reflow
    el.style.removeProperty('animation');
  }

  /** 점수 숫자 bump 애니메이션 — kf-score-bump (design-spec.md §4) */
  function bumpScoreEl(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'kf-score-bump var(--duration-normal) var(--easing-bounce) both';
  }

  /* ──────────────────────────────────────────────────────────
     6. GAME LOGIC
  ────────────────────────────────────────────────────────── */

  /**
   * 컴퓨터 패 결정
   * 공정: 균등 1/3 랜덤
   * 불공정: 70% 사용자 패배 패, 30% 나머지(무/승) 중 랜덤
   */
  function getCompChoice(userChoice) {
    if (state.mode === 'fair') {
      return CHOICES[Math.floor(Math.random() * CHOICES.length)];
    }
    // unfair
    if (Math.random() < 0.70) {
      return BEATS[userChoice];   // 사용자를 이기는 패
    }
    // 나머지 30%: 사용자가 이기거나 비기는 패 (= 사용자를 이기는 패 제외)
    var remaining = CHOICES.filter(function(c) { return c !== BEATS[userChoice]; });
    return remaining[Math.floor(Math.random() * remaining.length)];
  }

  /**
   * 승패 판정
   * BEATS[comp] = comp를 이기는 패, 그것이 user와 같으면 user 승
   */
  function calcOutcome(user, comp) {
    if (user === comp) return 'draw';
    if (BEATS[comp] === user) return 'win';
    return 'lose';
  }

  /* ──────────────────────────────────────────────────────────
     7. MODE SELECTION
  ────────────────────────────────────────────────────────── */
  function selectMode(mode) {
    state.mode = mode;
    E.modeFair.classList.toggle('mode-card--active', mode === 'fair');
    E.modeFair.setAttribute('aria-pressed', String(mode === 'fair'));
    E.modeUnfair.classList.toggle('mode-card--active', mode === 'unfair');
    E.modeUnfair.setAttribute('aria-pressed', String(mode === 'unfair'));
  }

  E.modeFair.addEventListener('click', function() {
    if (state.fsm !== 'start') return;
    selectMode('fair');
  });

  E.modeUnfair.addEventListener('click', function() {
    if (state.fsm !== 'start') return;
    selectMode('unfair');
  });

  /* ──────────────────────────────────────────────────────────
     8. START → PLAYING
  ────────────────────────────────────────────────────────── */
  E.btnStart.addEventListener('click', function(e) {
    if (state.busy || state.fsm !== 'start') return;

    addRipple(this, e);
    state.fsm = 'playing';

    // 모드 배지 업데이트
    var isFair = (state.mode === 'fair');
    E.modeBadge.className = 'mode-badge ' + (isFair ? 'mode-badge--fair' : 'mode-badge--unfair');
    E.modeBadgeIcon.textContent  = isFair ? '⚖️' : '😈';
    E.modeBadgeLabel.textContent = isFair ? '공정' : '불공정';

    updateScoreUI();
    showScreen('game');
  });

  /* ──────────────────────────────────────────────────────────
     9. PLAYING → COUNTDOWN (패 선택)
  ────────────────────────────────────────────────────────── */
  document.querySelectorAll('.btn-choice').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      if (state.busy || state.fsm !== 'playing') return;

      SFX.click();                       // grain-2: 선택 사운드
      state.busy       = true;
      state.userChoice = this.dataset.choice;
      state.fsm        = 'countdown';

      addRipple(this, e);

      // 카운트다운 화면 사용자 패 표시 설정
      var meta = META[state.userChoice];
      E.cdUserEmoji.textContent = meta.emoji;
      E.cdUserLabel.textContent = meta.label + ' 선택됨';

      showScreen('countdown');
      runCountdown();
    });
  });

  /* ──────────────────────────────────────────────────────────
     10. COUNTDOWN SEQUENCE
     각 스텝: 가위!(600ms) → 바위!(600ms) → 보!(600ms) → result 전환
     CSS animation kf-countdown-pulse 매 스텝 재실행
     Progress bar kf-progress-bar 1.8s (= 3 × 600ms) 동기화
  ────────────────────────────────────────────────────────── */
  function runCountdown() {
    // 프로그레스 바 애니메이션 재시작
    retriggerAnimation(E.cdProgFill);

    var step = 0;

    function showStep() {
      var word = CD_STEPS[step];
      E.cdText.textContent = word;

      // 마지막 "보!"는 gradient 스타일 추가
      var isFinalStep = (step === CD_STEPS.length - 1);
      if (isFinalStep) {
        E.cdText.classList.add('countdown-display__text--final');
      } else {
        E.cdText.classList.remove('countdown-display__text--final');
      }

      SFX.countdownTick(isFinalStep);    // grain-2: 카운트다운 틱 사운드

      // CSS 애니메이션 kf-countdown-pulse 재실행
      retriggerAnimation(E.cdText);

      step += 1;

      if (step < CD_STEPS.length) {
        setTimeout(showStep, DUR.COUNTDOWN_STEP);
      } else {
        // "보!" 애니메이션이 끝난 뒤 result 전환
        setTimeout(goToResult, DUR.COUNTDOWN_STEP);
      }
    }

    showStep();
  }

  /* ──────────────────────────────────────────────────────────
     11. RESULT SCREEN
  ────────────────────────────────────────────────────────── */
  function goToResult() {
    // 컴퓨터 패 결정 + 승패 판정
    state.compChoice = getCompChoice(state.userChoice);
    state.outcome    = calcOutcome(state.userChoice, state.compChoice);

    // 점수 누적
    state.score[state.outcome] += 1;
    updateScoreUI();

    // ── 콤보 추적 (grain-2) ──────────────────────────────────
    if (state.outcome === 'win') {
      state.combo += 1;
    } else {
      state.combo = 0;
    }

    // ── 사운드 피드백 (grain-2) ──────────────────────────────
    if      (state.outcome === 'win')  SFX.win();
    else if (state.outcome === 'lose') SFX.lose();
    else                               SFX.draw();

    // ── 콘페티 + 링 하이로 (grain-2) ───────────────────────
    if (state.outcome === 'win') {
      spawnConfetti();
      E.ringHaloWrap.classList.remove('hidden');
    } else {
      E.ringHaloWrap.classList.add('hidden');
    }

    // ── 콤보 배지 (grain-2) ─────────────────────────────────
    updateComboBadge();

    var userMeta  = META[state.userChoice];
    var compMeta  = META[state.compChoice];
    var isUnfairLose = (state.mode === 'unfair' && state.outcome === 'lose');

    // 결과 배너
    var bannerText  = { win: 'WIN! 🎉', lose: 'LOSE 💀', draw: 'DRAW 🤝' };
    var bannerCls   = { win: 'result-banner--win', lose: 'result-banner--lose', draw: 'result-banner--draw' };
    E.resBanner.textContent = bannerText[state.outcome];
    E.resBanner.className   = 'result-banner ' + bannerCls[state.outcome];
    retriggerAnimation(E.resBanner);

    // 배경 오버레이
    var overlayCls = { win: 'result-overlay--win', lose: 'result-overlay--lose', draw: 'result-overlay--draw' };
    E.resOverlay.className = 'result-overlay ' + overlayCls[state.outcome];

    // 사용자 패 카드
    E.resUserEmoji.textContent = userMeta.emoji;
    E.resUserLabel.textContent = userMeta.label;

    // 컴퓨터 패 카드 — 불공정+패배 시 이빌 이모지 이스터에그
    E.resCompEmoji.textContent = isUnfairLose ? '😈' : compMeta.emoji;
    E.resCompLabel.textContent = compMeta.label;
    E.resCompCard.classList.toggle('unfair-tint', state.mode === 'unfair');

    // 치트 서브텍스트 — 불공정+패배 시만 노출
    if (isUnfairLose) {
      E.resCurse.textContent = EASTER_EGG_LABEL;
      E.resCurse.classList.add('result-curse--visible');
    } else {
      E.resCurse.classList.remove('result-curse--visible');
    }

    state.fsm  = 'result';
    state.busy = false;

    showScreen('result');
  }

  /* ──────────────────────────────────────────────────────────
     12. NEXT ROUND (다음 라운드 ▶)
  ────────────────────────────────────────────────────────── */
  E.btnNext.addEventListener('click', function(e) {
    if (state.busy || state.fsm !== 'result') return;
    state.busy = true;

    SFX.click();                         // grain-2
    addRipple(this, e);
    clearConfetti();                     // grain-2: 콘페티 정리

    state.fsm        = 'playing';
    state.userChoice = null;
    state.compChoice = null;
    state.outcome    = null;

    // 짧은 딜레이 후 전환 (리플 애니메이션 끝날 여유)
    setTimeout(function() {
      state.busy = false;
      showScreen('game');
    }, DUR.FAST);
  });

  /* ──────────────────────────────────────────────────────────
     13. END GAME (게임 종료)
  ────────────────────────────────────────────────────────── */
  E.btnEnd.addEventListener('click', function() {
    if (state.busy || state.fsm !== 'playing') return;
    state.busy = true;

    clearConfetti();                     // grain-2

    // 전체 상태 초기화
    state.fsm        = 'start';
    state.userChoice = null;
    state.compChoice = null;
    state.outcome    = null;
    state.score      = { win: 0, draw: 0, lose: 0 };
    state.combo      = 0;               // grain-2

    // 모드를 공정으로 리셋
    selectMode('fair');

    setTimeout(function() {
      state.busy = false;
      showScreen('start');
    }, DUR.FAST);
  });

  /* ──────────────────────────────────────────────────────────
     14. INITIAL RENDER
  ────────────────────────────────────────────────────────── */
  showScreen('start');

</script>
</body>
</html>
