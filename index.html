<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가위바위보</title>
  <style>
    /* ============================================================
       DESIGN TOKENS — Color
    ============================================================ */
    :root {
      /* 배경 */
      --color-bg-page:     #1a1a2e;
      --color-bg-surface:  #16213e;
      --color-bg-elevated: #0f3460;

      /* 텍스트 */
      --color-text-primary:   #e0e0e0;
      --color-text-secondary: #a0a0b0;
      --color-text-on-accent: #ffffff;

      /* 선택지 강조 */
      --color-choice-rock:          #e94560;
      --color-choice-scissors:      #533483;
      --color-choice-paper:         #0f9b58;
      --color-choice-hover-ring:    rgba(255, 255, 255, 0.25);
      --color-choice-selected-ring: rgba(255, 255, 255, 0.70);

      /* 승/패/무 시맨틱 */
      --color-win:  #4caf50;
      --color-lose: #f44336;
      --color-draw: #ff9800;

      /* 테두리 및 보조 */
      --color-border-default: rgba(255, 255, 255, 0.12);
      --color-overlay:        rgba(0, 0, 0, 0.40);

      /* 모드 강조 (기존 토큰 alias) */
      --color-mode-fair-accent:   var(--color-win);          /* ⚖️ 공정 모드 */
      --color-mode-unfair-accent: var(--color-choice-rock);  /* 😈 불공정 모드 */

      /* ============================================================
         DESIGN TOKENS — Typography
      ============================================================ */
      --font-family-base: 'Segoe UI', system-ui, -apple-system, sans-serif;

      --text-size-xs:  0.75rem;
      --text-size-sm:  0.875rem;
      --text-size-md:  1rem;
      --text-size-lg:  1.25rem;
      --text-size-xl:  1.5rem;
      --text-size-2xl: 2rem;
      --text-size-3xl: 3rem;
      --text-size-4xl: 4rem;

      --font-weight-regular: 400;
      --font-weight-medium:  500;
      --font-weight-bold:    700;
      --font-weight-black:   900;

      --line-height-tight:  1.2;
      --line-height-normal: 1.5;
      --line-height-loose:  1.8;

      --letter-spacing-tight:  -0.02em;
      --letter-spacing-normal: 0em;
      --letter-spacing-wide:   0.05em;
      --letter-spacing-caps:   0.08em;

      /* 역할별 매핑 */
      --text-score-size:        var(--text-size-3xl);
      --text-score-weight:      var(--font-weight-black);
      --text-score-line-height: var(--line-height-tight);

      --text-result-size:        var(--text-size-xl);
      --text-result-weight:      var(--font-weight-bold);
      --text-result-line-height: var(--line-height-tight);

      --text-label-size:        var(--text-size-sm);
      --text-label-weight:      var(--font-weight-medium);
      --text-label-line-height: var(--line-height-normal);

      --text-choice-icon-size: var(--text-size-3xl);

      /* 카운트다운 텍스트 */
      --text-countdown-size:           var(--text-size-4xl);
      --text-countdown-weight:         var(--font-weight-black);
      --text-countdown-letter-spacing: var(--letter-spacing-tight);

      /* ============================================================
         DESIGN TOKENS — Spacing
      ============================================================ */
      --spacing-1:  4px;
      --spacing-2:  8px;
      --spacing-3:  12px;
      --spacing-4:  16px;
      --spacing-5:  20px;
      --spacing-6:  24px;
      --spacing-8:  32px;
      --spacing-10: 40px;
      --spacing-12: 48px;
      --spacing-16: 64px;

      /* 역할별 매핑 */
      --button-padding-inline: var(--spacing-8);
      --button-padding-block:  var(--spacing-8);
      --section-gap:           var(--spacing-12);
      --page-padding:          var(--spacing-6);
      --choice-group-gap:      var(--spacing-6);
      --scoreboard-gap:        var(--spacing-8);
      --score-item-gap:        var(--spacing-2);
      --result-content-gap:    var(--spacing-4);

      /* ============================================================
         DESIGN TOKENS — Shadow
      ============================================================ */
      --shadow-none: none;
      --shadow-sm:   0 2px 8px rgba(0, 0, 0, 0.30);
      --shadow-md:   0 4px 16px rgba(0, 0, 0, 0.40);
      --shadow-lg:   0 8px 32px rgba(0, 0, 0, 0.50);

      --shadow-choice-hover-rock:     0 0 20px rgba(233, 69, 96, 0.60);
      --shadow-choice-hover-scissors: 0 0 20px rgba(83, 52, 131, 0.70);
      --shadow-choice-hover-paper:    0 0 20px rgba(15, 155, 88, 0.60);
      --shadow-choice-selected:       0 0 28px rgba(255, 255, 255, 0.40);

      --shadow-result-win:  0 0 24px rgba(76, 175, 80, 0.50);
      --shadow-result-lose: 0 0 24px rgba(244, 67, 54, 0.50);
      --shadow-result-draw: 0 0 24px rgba(255, 152, 0, 0.50);

      /* 모드 카드 선택 강조 */
      --shadow-mode-fair-selected:   0 0 24px rgba(76, 175, 80, 0.40);
      --shadow-mode-unfair-selected: 0 0 24px rgba(233, 69, 96, 0.40);

      /* ============================================================
         DESIGN TOKENS — Transition
      ============================================================ */
      --duration-instant: 80ms;
      --duration-fast:    150ms;
      --duration-normal:  250ms;
      --duration-slow:    400ms;
      --duration-reveal:  600ms;

      --easing-default: ease;
      --easing-in:      ease-in;
      --easing-out:     ease-out;
      --easing-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-smooth:  cubic-bezier(0.25, 0.46, 0.45, 0.94);

      --transition-choice-hover:  var(--duration-fast) var(--easing-out);
      --transition-choice-select: var(--duration-normal) var(--easing-spring);
      --transition-reveal:        var(--duration-reveal) var(--easing-smooth);
      --transition-score:         var(--duration-slow) var(--easing-out);
      --transition-screen:        var(--duration-slow) var(--easing-smooth);

      /* ============================================================
         DESIGN TOKENS — Radius
      ============================================================ */
      --radius-none: 0px;
      --radius-sm:   4px;
      --radius-md:   8px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-full: 9999px;

      /* 역할별 매핑 */
      --radius-choice-button: var(--radius-full);
      --radius-result-banner: var(--radius-xl);
      --radius-scoreboard:    var(--radius-lg);
      --radius-score-item:    var(--radius-md);
      --radius-mode-card:     var(--radius-xl);

      /* ============================================================
         DESIGN TOKENS — Border
      ============================================================ */
      --border-width-thin:   1px;
      --border-width-medium: 2px;
    }

    /* ============================================================
       RESPONSIVE OVERRIDES — Small Mobile (≤ 420px)
    ============================================================ */
    @media (max-width: 420px) {
      :root {
        --button-padding-inline: var(--spacing-5);
        --button-padding-block:  var(--spacing-5);
        --text-choice-icon-size: var(--text-size-2xl);
        --text-score-size:       var(--text-size-2xl);
        --text-size-4xl:         2.5rem;
        --section-gap:           var(--spacing-8);
        --page-padding:          var(--spacing-4);
        --choice-group-gap:      var(--spacing-4);
      }
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family-base);
      background-color: var(--color-bg-page);
      color: var(--color-text-primary);
      line-height: var(--line-height-normal);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ============================================================
       SCREEN TRANSITIONS
    ============================================================ */
    .screen {
      width: 100%;
      transition: opacity var(--transition-screen);
    }

    .screen.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .screen.is-gone {
      display: none;
    }

    /* ============================================================
       PAGE LAYOUT
    ============================================================ */
    .page {
      width: 100%;
      max-width: 640px;
      padding-inline: var(--page-padding);
      padding-block: var(--spacing-8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--section-gap);
      margin-inline: auto;
    }

    /* ============================================================
       GAME HEADER
    ============================================================ */
    .game-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-2);
    }

    .game-title {
      font-size: var(--text-size-2xl);
      font-weight: var(--font-weight-black);
      color: var(--color-text-primary);
      line-height: var(--line-height-tight);
      letter-spacing: var(--letter-spacing-tight);
    }

    .game-subtitle {
      font-size: var(--text-size-sm);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-wide);
    }

    /* ============================================================
       MODE SELECT SECTION (Start Screen)
    ============================================================ */
    .mode-select {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-4);
    }

    .mode-select__heading {
      font-size: var(--text-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-caps);
      text-transform: uppercase;
    }

    .mode-card-group {
      display: flex;
      gap: var(--spacing-4);
      width: 100%;
    }

    @media (max-width: 420px) {
      .mode-card-group {
        flex-direction: column;
      }
    }

    .mode-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-6);
      background-color: var(--color-bg-surface);
      border: var(--border-width-medium) solid var(--color-border-default);
      border-radius: var(--radius-mode-card);
      color: var(--color-text-primary);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: center;
      font-family: var(--font-family-base);
      transition:
        border-color var(--duration-normal) var(--easing-default),
        box-shadow var(--duration-normal) var(--easing-default),
        transform var(--duration-fast) var(--easing-out);
    }

    .mode-card:hover {
      transform: translateY(-3px);
    }

    .mode-card:active {
      transform: scale(0.97);
    }

    /* 선택된 공정 모드 */
    .mode-card--fair.is-selected {
      border-color: var(--color-mode-fair-accent);
      box-shadow: var(--shadow-mode-fair-selected);
    }

    /* 선택된 불공정 모드 */
    .mode-card--unfair.is-selected {
      border-color: var(--color-mode-unfair-accent);
      box-shadow: var(--shadow-mode-unfair-selected);
    }

    .mode-card__icon {
      font-size: var(--text-size-2xl);
      line-height: 1;
    }

    .mode-card__title {
      font-size: var(--text-size-md);
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-tight);
      display: block;
    }

    .mode-card__desc {
      font-size: var(--text-size-xs);
      color: var(--color-text-secondary);
      line-height: var(--line-height-normal);
    }

    /* ============================================================
       START BUTTON (CTA)
    ============================================================ */
    .start-button {
      font-family: var(--font-family-base);
      font-size: var(--text-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-on-accent);
      background: linear-gradient(135deg, var(--color-choice-rock) 0%, var(--color-choice-scissors) 100%);
      border: none;
      border-radius: var(--radius-full);
      padding: var(--spacing-4) var(--spacing-12);
      cursor: pointer;
      letter-spacing: var(--letter-spacing-wide);
      box-shadow: var(--shadow-md);
      transition:
        transform var(--duration-fast) var(--easing-out),
        box-shadow var(--duration-fast) var(--easing-out),
        filter var(--duration-fast) var(--easing-out);
    }

    .start-button:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: var(--shadow-lg);
      filter: brightness(1.12);
    }

    .start-button:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
      filter: none;
    }

    /* ============================================================
       MODE BADGE (Game Screen Header)
    ============================================================ */
    .mode-badge {
      display: inline-block;
      font-size: var(--text-size-xs);
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-caps);
      text-transform: uppercase;
      padding: var(--spacing-1) var(--spacing-4);
      border-radius: var(--radius-full);
      border: var(--border-width-thin) solid currentColor;
    }

    .mode-badge--fair {
      color: var(--color-mode-fair-accent);
      background-color: rgba(76, 175, 80, 0.12);
    }

    .mode-badge--unfair {
      color: var(--color-mode-unfair-accent);
      background-color: rgba(233, 69, 96, 0.12);
    }

    /* ============================================================
       SCOREBOARD
    ============================================================ */
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: var(--scoreboard-gap);
      background-color: var(--color-bg-surface);
      border-radius: var(--radius-scoreboard);
      padding: var(--spacing-6);
      border: var(--border-width-thin) solid var(--color-border-default);
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--score-item-gap);
      flex: 1;
    }

    .score-label {
      font-size: var(--text-label-size);
      font-weight: var(--text-label-weight);
      line-height: var(--text-label-line-height);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-caps);
      text-transform: uppercase;
    }

    .score-number {
      font-size: var(--text-score-size);
      font-weight: var(--text-score-weight);
      line-height: var(--text-score-line-height);
    }

    .score-item--win  .score-number { color: var(--color-win);  }
    .score-item--draw .score-number { color: var(--color-draw); }
    .score-item--lose .score-number { color: var(--color-lose); }

    @keyframes score-bounce {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.45); }
      55%  { transform: scale(0.88); }
      80%  { transform: scale(1.1);  }
      100% { transform: scale(1);   }
    }

    .score-number.bounce {
      animation: score-bounce var(--duration-slow) var(--easing-out);
    }

    /* ============================================================
       GAME ARENA
    ============================================================ */
    .game-arena {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-6);
      background-color: var(--color-bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--spacing-8) var(--page-padding);
      border: var(--border-width-thin) solid var(--color-border-default);
    }

    .player-section,
    .computer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-3);
      flex: 1;
    }

    .section-title {
      font-size: var(--text-label-size);
      font-weight: var(--text-label-weight);
      line-height: var(--text-label-line-height);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-caps);
      text-transform: uppercase;
    }

    .choice-display {
      font-size: var(--text-choice-icon-size);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-5);
      background-color: var(--color-bg-elevated);
      border-radius: var(--radius-full);
      border: var(--border-width-medium) solid var(--color-border-default);
      aspect-ratio: 1;
      min-width: calc(var(--text-choice-icon-size) + var(--spacing-10));
    }

    .choice-display.is-thinking {
      animation: thinking-blink calc(var(--duration-instant) * 2) var(--easing-default) infinite;
    }

    .choice-display.is-revealed {
      animation: choice-reveal var(--duration-normal) var(--easing-spring) forwards;
    }

    @keyframes thinking-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.82); }
    }

    @keyframes choice-reveal {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }

    .vs-separator {
      font-size: var(--text-size-lg);
      font-weight: var(--font-weight-black);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-wide);
      flex-shrink: 0;
    }

    /* ============================================================
       RESULT BANNER
    ============================================================ */
    .result-banner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--result-content-gap);
      border-radius: var(--radius-result-banner);
      padding: var(--spacing-5) var(--spacing-6);
      background-color: var(--color-bg-surface);
      border: var(--border-width-thin) solid var(--color-border-default);
      min-height: calc(var(--spacing-12) + var(--spacing-4));
      transition:
        box-shadow var(--transition-reveal),
        border-color var(--transition-reveal);
    }

    .result-text {
      font-size: var(--text-result-size);
      font-weight: var(--text-result-weight);
      line-height: var(--text-result-line-height);
      color: var(--color-text-secondary);
      text-align: center;
      transition: color var(--transition-reveal);
    }

    .result-banner--win {
      box-shadow: var(--shadow-result-win);
      border-color: var(--color-win);
    }
    .result-banner--win .result-text { color: var(--color-win); }

    .result-banner--lose {
      box-shadow: var(--shadow-result-lose);
      border-color: var(--color-lose);
    }
    .result-banner--lose .result-text { color: var(--color-lose); }

    .result-banner--draw {
      box-shadow: var(--shadow-result-draw);
      border-color: var(--color-draw);
    }
    .result-banner--draw .result-text { color: var(--color-draw); }

    @keyframes banner-flash {
      0%   {
        opacity: 0.6;
        transform: translateY(calc(-1 * var(--spacing-2))) scale(0.97);
      }
      60%  { transform: translateY(0) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1);    opacity: 1; }
    }

    .result-banner--flash {
      animation: banner-flash var(--duration-normal) var(--easing-spring) forwards;
    }

    /* ============================================================
       COUNTDOWN STAGE
       가위! → 바위! → 보! 카운트다운 텍스트 애니메이션 영역
       result-banner 와 동일한 레이아웃 크기를 유지해 전환 시 레이아웃 이동 최소화
    ============================================================ */
    .countdown-stage {
      display: none;
      width: 100%;
      min-height: calc(var(--spacing-12) + var(--spacing-4));
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-result-banner);
      padding: var(--spacing-5) var(--spacing-6);
      background-color: var(--color-bg-surface);
      border: var(--border-width-thin) solid var(--color-border-default);
    }

    .countdown-stage.is-active {
      display: flex;
    }

    /* result-banner는 카운트다운 중 숨김 처리 */
    .result-banner.is-counting {
      display: none;
    }

    .countdown-word {
      font-family: var(--font-family-base);
      font-size:   var(--text-countdown-size);
      font-weight: var(--text-countdown-weight);
      letter-spacing: var(--text-countdown-letter-spacing);
      line-height: 1;
      opacity: 0;
    }

    .countdown-word.is-entering {
      animation: countdown-enter 150ms var(--easing-spring) forwards;
    }

    .countdown-word.is-exiting {
      animation: countdown-exit 100ms var(--easing-in) forwards;
    }

    @keyframes countdown-enter {
      0%   { opacity: 0; transform: scale(0.30) translateY(10px); }
      55%  { opacity: 1; transform: scale(1.14) translateY(-3px); }
      78%  { transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1)    translateY(0); }
    }

    @keyframes countdown-exit {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.55) translateY(-8px); }
    }

    /* ============================================================
       CHOICE BUTTONS
    ============================================================ */
    .choice-group {
      display: flex;
      gap: var(--choice-group-gap);
      justify-content: center;
      flex-wrap: wrap;
    }

    .choice-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      padding: var(--button-padding-block) var(--button-padding-inline);
      border: var(--border-width-medium) solid var(--color-border-default);
      border-radius: var(--radius-choice-button);
      background-color: var(--color-bg-elevated);
      color: var(--color-text-primary);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition:
        transform var(--transition-choice-hover),
        box-shadow var(--transition-choice-hover),
        border-color var(--transition-choice-hover);
    }

    .choice-button--rock     { border-color: var(--color-choice-rock); }
    .choice-button--scissors { border-color: var(--color-choice-scissors); }
    .choice-button--paper    { border-color: var(--color-choice-paper); }

    .choice-button--rock:hover,
    .choice-button--rock:focus-visible {
      transform: scale(1.1);
      box-shadow: var(--shadow-choice-hover-rock), var(--shadow-md);
      border-color: var(--color-choice-hover-ring);
    }

    .choice-button--scissors:hover,
    .choice-button--scissors:focus-visible {
      transform: scale(1.1);
      box-shadow: var(--shadow-choice-hover-scissors), var(--shadow-md);
      border-color: var(--color-choice-hover-ring);
    }

    .choice-button--paper:hover,
    .choice-button--paper:focus-visible {
      transform: scale(1.1);
      box-shadow: var(--shadow-choice-hover-paper), var(--shadow-md);
      border-color: var(--color-choice-hover-ring);
    }

    .choice-button:active {
      transform: scale(0.92);
      box-shadow: var(--shadow-none);
    }

    .choice-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .choice-icon {
      font-size: var(--text-choice-icon-size);
      line-height: 1;
    }

    .choice-label {
      font-size: var(--text-label-size);
      font-weight: var(--text-label-weight);
      line-height: var(--text-label-line-height);
      color: var(--color-text-secondary);
      letter-spacing: var(--letter-spacing-wide);
    }

    /* ============================================================
       RESET BUTTON
    ============================================================ */
    .reset-button {
      font-family: var(--font-family-base);
      font-size: var(--text-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      background: transparent;
      border: var(--border-width-thin) solid var(--color-border-default);
      border-radius: var(--radius-full);
      padding: var(--spacing-2) var(--spacing-6);
      cursor: pointer;
      letter-spacing: var(--letter-spacing-wide);
      transition:
        color var(--transition-choice-hover),
        border-color var(--transition-choice-hover),
        transform var(--transition-choice-hover);
    }

    .reset-button:hover {
      color: var(--color-text-primary);
      border-color: var(--color-text-secondary);
    }

    .reset-button:active {
      transform: scale(0.95);
    }

    .reset-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ============================================================
       EXIT BUTTON (게임 종료)
    ============================================================ */
    .exit-button {
      font-family: var(--font-family-base);
      font-size: var(--text-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      background: transparent;
      border: var(--border-width-thin) solid var(--color-border-default);
      border-radius: var(--radius-full);
      padding: var(--spacing-2) var(--spacing-6);
      cursor: pointer;
      letter-spacing: var(--letter-spacing-wide);
      transition:
        color var(--transition-choice-hover),
        border-color var(--transition-choice-hover),
        transform var(--transition-choice-hover);
    }

    .exit-button:hover {
      color: var(--color-lose);
      border-color: var(--color-lose);
    }

    .exit-button:active {
      transform: scale(0.95);
    }

    .exit-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ============================================================
       GAME CONTROLS ROW (reset + exit)
    ============================================================ */
    .game-controls {
      display: flex;
      gap: var(--spacing-3);
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       START SCREEN
  ============================================================ -->
  <div id="screen-start" class="screen screen--start">
    <div class="page">

      <header class="game-header">
        <h1 class="game-title">✊ 가위바위보 ✌️</h1>
        <p class="game-subtitle">컴퓨터와 끝없는 대전</p>
      </header>

      <section class="mode-select" aria-label="게임 모드 선택">
        <p class="mode-select__heading">모드 선택</p>
        <div class="mode-card-group" role="group" aria-label="게임 모드">
          <button
            class="mode-card mode-card--fair is-selected"
            id="card-fair"
            aria-pressed="true"
          >
            <span class="mode-card__icon" aria-hidden="true">⚖️</span>
            <strong class="mode-card__title">공정 모드</strong>
            <span class="mode-card__desc">컴퓨터가 랜덤하게<br>가위·바위·보 선택</span>
          </button>
          <button
            class="mode-card mode-card--unfair"
            id="card-unfair"
            aria-pressed="false"
          >
            <span class="mode-card__icon" aria-hidden="true">😈</span>
            <strong class="mode-card__title">불공정 모드</strong>
            <span class="mode-card__desc">컴퓨터가 70% 확률로<br>이기는 패 선택</span>
          </button>
        </div>
      </section>

      <button class="start-button" id="btn-start">게임 시작</button>

    </div>
  </div>

  <!-- ============================================================
       GAME SCREEN
  ============================================================ -->
  <div id="screen-game" class="screen screen--game is-hidden is-gone">
    <div class="page">

      <!-- 헤더 + 모드 배지 -->
      <header class="game-header">
        <h1 class="game-title">✊ 가위바위보 ✌️</h1>
        <span class="mode-badge mode-badge--fair" id="mode-badge">⚖️ 공정 모드</span>
      </header>

      <!-- 점수판 -->
      <section class="scoreboard" aria-label="점수판">
        <div class="score-item score-item--win">
          <span class="score-label">승</span>
          <span class="score-number" id="score-win">0</span>
        </div>
        <div class="score-item score-item--draw">
          <span class="score-label">무</span>
          <span class="score-number" id="score-draw">0</span>
        </div>
        <div class="score-item score-item--lose">
          <span class="score-label">패</span>
          <span class="score-number" id="score-lose">0</span>
        </div>
      </section>

      <!-- 게임 화면 -->
      <section class="game-arena" aria-label="게임 화면">
        <div class="player-section">
          <h2 class="section-title">나</h2>
          <div class="choice-display" id="player-display" aria-label="플레이어 선택">🤔</div>
        </div>
        <div class="vs-separator" aria-hidden="true">VS</div>
        <div class="computer-section">
          <h2 class="section-title">컴퓨터</h2>
          <div class="choice-display" id="computer-display" aria-label="컴퓨터 선택">🤔</div>
        </div>
      </section>

      <!-- 카운트다운 스테이지 -->
      <div
        class="countdown-stage"
        id="countdown-stage"
        role="status"
        aria-live="assertive"
        aria-atomic="true"
      >
        <span class="countdown-word" id="countdown-word" aria-hidden="true"></span>
      </div>

      <!-- 결과 배너 -->
      <section
        class="result-banner"
        id="result-banner"
        aria-live="polite"
        aria-label="라운드 결과"
      >
        <p class="result-text" id="result-text">선택지를 눌러 게임을 시작하세요</p>
      </section>

      <!-- 선택 버튼 -->
      <section class="choice-group" aria-label="선택지">
        <button
          class="choice-button choice-button--rock"
          id="btn-rock"
          aria-label="바위 선택"
        >
          <span class="choice-icon" aria-hidden="true">✊</span>
          <span class="choice-label">바위</span>
        </button>
        <button
          class="choice-button choice-button--paper"
          id="btn-paper"
          aria-label="보 선택"
        >
          <span class="choice-icon" aria-hidden="true">🖐️</span>
          <span class="choice-label">보</span>
        </button>
        <button
          class="choice-button choice-button--scissors"
          id="btn-scissors"
          aria-label="가위 선택"
        >
          <span class="choice-icon" aria-hidden="true">✌️</span>
          <span class="choice-label">가위</span>
        </button>
      </section>

      <!-- 하단 컨트롤 -->
      <div class="game-controls">
        <button class="reset-button" id="btn-reset">점수 초기화</button>
        <button class="exit-button" id="btn-exit">게임 종료</button>
      </div>

    </div>
  </div>

  <script>
    /* ============================================================
       GAME DATA
    ============================================================ */
    const CHOICES = ['rock', 'paper', 'scissors'];

    const EMOJI = {
      rock:     '✊',
      paper:    '🖐️',
      scissors: '✌️',
    };

    const LABEL = {
      rock:     '바위',
      paper:    '보',
      scissors: '가위',
    };

    /* 컴퓨터가 이기는 선택 (player → computer win) */
    const BEATS = {
      rock:     'paper',    /* paper beats rock     */
      paper:    'scissors', /* scissors beats paper  */
      scissors: 'rock',     /* rock beats scissors   */
    };

    /* 컴퓨터가 지는 선택 (player beats this) */
    const LOSES_TO = {
      rock:     'scissors', /* rock beats scissors   */
      paper:    'rock',     /* paper beats rock      */
      scissors: 'paper',    /* scissors beats paper  */
    };

    /* ============================================================
       STATE
    ============================================================ */
    const score = { win: 0, draw: 0, lose: 0 };
    let isPlaying   = false;
    let currentMode = 'fair'; /* 'fair' | 'unfair' */

    /* ============================================================
       DOM REFERENCES
    ============================================================ */
    const playerDisplay   = document.getElementById('player-display');
    const computerDisplay = document.getElementById('computer-display');
    const resultBanner    = document.getElementById('result-banner');
    const resultText      = document.getElementById('result-text');
    const countdownStage  = document.getElementById('countdown-stage');
    const countdownWord   = document.getElementById('countdown-word');
    const scoreWin        = document.getElementById('score-win');
    const scoreDraw       = document.getElementById('score-draw');
    const scoreLose       = document.getElementById('score-lose');
    const choiceButtons   = document.querySelectorAll('.choice-button');
    const modeBadge       = document.getElementById('mode-badge');
    const exitButton      = document.getElementById('btn-exit');
    const resetButton     = document.getElementById('btn-reset');

    /* ============================================================
       SCREEN TRANSITIONS
       display:none → opacity:0 → opacity:1 (fade in)
       opacity:1 → opacity:0 (transitionend) → display:none
    ============================================================ */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(screen => {
        if (screen.id === id) {
          /* Step 1: make visible but transparent */
          screen.classList.remove('is-gone');
          /* Step 2: two rAF → let browser paint → then start fade-in */
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              screen.classList.remove('is-hidden');
            });
          });
        } else {
          /* Start fade-out, then hide after transition */
          screen.classList.add('is-hidden');
          screen.addEventListener(
            'transitionend',
            () => { screen.classList.add('is-gone'); },
            { once: true }
          );
        }
      });
    }

    /* ============================================================
       MODE SELECTION
    ============================================================ */
    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.mode-card').forEach(c => {
          c.classList.remove('is-selected');
          c.setAttribute('aria-pressed', 'false');
        });
        card.classList.add('is-selected');
        card.setAttribute('aria-pressed', 'true');
        currentMode = card.id === 'card-fair' ? 'fair' : 'unfair';
      });
    });

    /* ============================================================
       GAME START
    ============================================================ */
    document.getElementById('btn-start').addEventListener('click', () => {
      /* Sync mode badge */
      if (currentMode === 'fair') {
        modeBadge.textContent = '⚖️ 공정 모드';
        modeBadge.className   = 'mode-badge mode-badge--fair';
      } else {
        modeBadge.textContent = '😈 불공정 모드';
        modeBadge.className   = 'mode-badge mode-badge--unfair';
      }
      showScreen('screen-game');
    });

    /* ============================================================
       GAME EXIT — score reset + return to start
    ============================================================ */
    document.getElementById('btn-exit').addEventListener('click', () => {
      resetGame();
      showScreen('screen-start');
    });

    /* ============================================================
       COMPUTER CHOICE — fair vs unfair AI
       순수 함수: 클로저(currentMode) 미사용, 외부에서 테스트 가능
    ============================================================ */
    function getComputerChoice(playerChoice, mode) {
      if (mode === 'fair') {
        /* 공정: 완전 랜덤 */
        return CHOICES[Math.floor(Math.random() * CHOICES.length)];
      }

      /* 불공정: 70% 확률로 이기는 패, 30%는 비기거나 지는 패 중 50:50 랜덤 */
      if (Math.random() < 0.7) {
        return BEATS[playerChoice];
      }
      const pool = [playerChoice, LOSES_TO[playerChoice]]; /* draw or lose */
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /* ============================================================
       GAME LOGIC — Judgment
       rock beats scissors / scissors beats paper / paper beats rock
    ============================================================ */
    function getResult(player, computer) {
      if (player === computer) return 'draw';
      if (
        (player === 'rock'     && computer === 'scissors') ||
        (player === 'scissors' && computer === 'paper')    ||
        (player === 'paper'    && computer === 'rock')
      ) return 'win';
      return 'lose';
    }

    /* ============================================================
       COUNTDOWN ANIMATION
       가위! → 바위! → 보! 세 단어를 순차적으로 pop-in/out.
       각 단어 300ms (enter 150ms + hold 50ms + exit 100ms),
       총 소요 시간 ≈ 900ms.
       동시에 computer-display는 이모지를 고속 순환해 긴장감 연출.
    ============================================================ */
    const COUNTDOWN_CONFIG = [
      { text: '가위!', color: 'var(--color-choice-scissors)', glow: 'rgba(83,52,131,0.85)'  },
      { text: '바위!', color: 'var(--color-choice-rock)',     glow: 'rgba(233,69,96,0.85)'  },
      { text: '보!',   color: 'var(--color-choice-paper)',    glow: 'rgba(15,155,88,0.85)'  },
    ];

    function runCountdown() {
      return new Promise(resolve => {
        const ENTER_MS = 150;
        const HOLD_MS  =  50;
        const EXIT_MS  = 100;

        /* Show countdown stage; hide result-banner (display:none swap) */
        resultBanner.classList.add('is-counting');
        countdownStage.classList.add('is-active');

        let idx = 0;

        function showWord() {
          if (idx >= COUNTDOWN_CONFIG.length) {
            countdownStage.classList.remove('is-active');
            resultBanner.classList.remove('is-counting');
            resolve();
            return;
          }

          const { text, color, glow } = COUNTDOWN_CONFIG[idx];
          countdownWord.textContent    = text;
          countdownWord.style.color    = color;
          countdownWord.style.textShadow =
            `0 0 24px ${glow}, 0 0 52px ${glow}`;

          /* Trigger enter animation (force reflow for re-trigger) */
          countdownWord.classList.remove('is-exiting');
          void countdownWord.offsetWidth;
          countdownWord.classList.add('is-entering');

          setTimeout(() => {
            /* Trigger exit animation */
            countdownWord.classList.remove('is-entering');
            void countdownWord.offsetWidth;
            countdownWord.classList.add('is-exiting');

            setTimeout(() => {
              idx++;
              showWord();
            }, EXIT_MS);
          }, ENTER_MS + HOLD_MS);
        }

        showWord();
      });
    }

    /* ============================================================
       SCORE UPDATE — with bounce animation
    ============================================================ */
    function updateScore(result) {
      score[result]++;

      const el = { win: scoreWin, draw: scoreDraw, lose: scoreLose }[result];
      el.textContent = score[result];

      el.classList.remove('bounce');
      void el.offsetWidth;
      el.classList.add('bounce');
      el.addEventListener('animationend', () => el.classList.remove('bounce'), { once: true });
    }

    /* ============================================================
       RESULT BANNER — flash with semantic color
    ============================================================ */
    function showResult(result, computerChoice) {
      const CONFIG = {
        win:  { text: `🎉 승리! — 컴퓨터: ${LABEL[computerChoice]}`,   mod: 'win'  },
        lose: { text: `😢 패배 — 컴퓨터: ${LABEL[computerChoice]}`,   mod: 'lose' },
        draw: { text: `🤝 무승부 — 컴퓨터: ${LABEL[computerChoice]}`, mod: 'draw' },
      };

      const { text, mod } = CONFIG[result];
      resultText.textContent = text;

      resultBanner.className = 'result-banner';
      void resultBanner.offsetWidth;
      resultBanner.classList.add(`result-banner--${mod}`, 'result-banner--flash');

      resultBanner.addEventListener(
        'animationend',
        () => resultBanner.classList.remove('result-banner--flash'),
        { once: true }
      );
    }

    /* ============================================================
       BUTTONS ENABLE / DISABLE
    ============================================================ */
    function setButtonsEnabled(enabled) {
      choiceButtons.forEach(btn => { btn.disabled = !enabled; });
      exitButton.disabled  = !enabled;
      resetButton.disabled = !enabled;
    }

    /* ============================================================
       MAIN PLAY FLOW
    ============================================================ */
    async function play(playerChoice) {
      if (isPlaying) return;
      isPlaying = true;
      setButtonsEnabled(false);

      /* Show player choice immediately with reveal animation */
      playerDisplay.textContent = EMOJI[playerChoice];
      playerDisplay.classList.add('is-revealed');
      playerDisplay.addEventListener(
        'animationend',
        () => playerDisplay.classList.remove('is-revealed'),
        { once: true }
      );

      /* Pick computer choice (resolved now, revealed after countdown) */
      const computerChoice = getComputerChoice(playerChoice, currentMode);

      /* Computer display: cycle through emojis to build suspense */
      let cycleIdx = 0;
      computerDisplay.classList.add('is-thinking');
      const cycleTimer = setInterval(() => {
        computerDisplay.textContent = EMOJI[CHOICES[cycleIdx % CHOICES.length]];
        cycleIdx++;
      }, 100);

      /* Run 가위! → 바위! → 보! countdown (~900ms) */
      await runCountdown();

      /* Stop cycling and reveal the actual choice */
      clearInterval(cycleTimer);
      computerDisplay.classList.remove('is-thinking');
      computerDisplay.textContent = EMOJI[computerChoice];
      computerDisplay.classList.add('is-revealed');
      await new Promise(resolve => {
        computerDisplay.addEventListener(
          'animationend',
          () => { computerDisplay.classList.remove('is-revealed'); resolve(); },
          { once: true }
        );
      });

      /* Judge, score, banner */
      const result = getResult(playerChoice, computerChoice);
      updateScore(result);
      showResult(result, computerChoice);

      setButtonsEnabled(true);
      isPlaying = false;
    }

    /* ============================================================
       RESET — score + arena state (stays on game screen)
    ============================================================ */
    function resetGame() {
      score.win = score.draw = score.lose = 0;
      scoreWin.textContent  = '0';
      scoreDraw.textContent = '0';
      scoreLose.textContent = '0';

      playerDisplay.textContent   = '🤔';
      computerDisplay.textContent = '🤔';
      computerDisplay.classList.remove('is-thinking', 'is-revealed');

      /* Ensure countdown stage is cleaned up (guard for exit-during-play) */
      countdownStage.classList.remove('is-active');
      resultBanner.classList.remove('is-counting');

      resultBanner.className = 'result-banner';
      resultText.textContent = '선택지를 눌러 게임을 시작하세요';
      resultText.style.color = '';

      isPlaying = false;
      setButtonsEnabled(true);
    }

    /* ============================================================
       EVENT BINDING
    ============================================================ */
    document.getElementById('btn-rock')    .addEventListener('click', () => play('rock'));
    document.getElementById('btn-paper')   .addEventListener('click', () => play('paper'));
    document.getElementById('btn-scissors').addEventListener('click', () => play('scissors'));
    document.getElementById('btn-reset')   .addEventListener('click', resetGame);
  </script>
</body>
</html>
