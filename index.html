<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div id="storage-banner" class="storage-banner" role="alert" hidden>
      저장 공간을 사용할 수 없습니다. 페이지를 닫으면 할 일 목록이 사라집니다.
    </div>

    <header class="app-header">
      <h1 class="app-title">할 일 목록</h1>
      <form class="todo-form" id="todo-form">
        <input
          class="todo-input"
          id="todo-input"
          type="text"
          placeholder="새 할 일을 입력하세요..."
          autocomplete="off"
          aria-label="새 할 일 입력"
        >
        <button class="btn-add" type="submit">추가</button>
      </form>
    </header>

    <main class="app-main">
      <ul class="todo-list" id="todo-list" aria-label="할 일 목록">
        <!-- app.js가 초기화 시 localStorage에서 항목을 동적으로 렌더링합니다 -->
      </ul>
      <p class="empty-state" id="empty-state" hidden>
        아직 추가된 할 일이 없습니다.
      </p>
    </main>

  </div>
  <script src="app.js"></script>
</body>
</html>
