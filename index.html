<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .landing {
      text-align: center;
      padding: 48px 24px;
    }

    .landing__heading {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="landing">
    <h1 class="landing__heading">Hello World</h1>
  </main>
</body>
</html>
